<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYNIX - Streaming AI Film</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }
    header {
      background: #111;
      padding: 20px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .ad-top {
      text-align: center;
      margin: 10px auto;
    }
    .film-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 16px;
      padding: 16px;
    }
    .film {
      flex: 0 0 auto;
      width: 200px;
      scroll-snap-align: start;
      cursor: pointer;
    }
    .film img {
      width: 100%;
      border-radius: 12px;
      transition: transform 0.3s;
    }
    .film img:hover {
      transform: scale(1.05);
    }
    .player {
      width: 100vw;
      max-height: 60vh;
      margin-top: 20px;
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 60vh;
      border: none;
    }
    .description {
      padding: 20px;
      background: #111;
    }
    .donasi {
      text-align: center;
      margin-top: 20px;
    }
    .donasi img {
      width: 150px;
    }
  </style>
</head>
<body>
  <header>VYNIX Streaming</header>  <div class="ad-top">
    <!-- Pasang kode iklan Adsterra di sini -->
    <p style="font-size: 14px; color: #888">[Slot Iklan Atas]</p>
  </div>  <div class="film-container">
    <div class="film" onclick="tonton('https://www.youtube.com/embed/dQw4w9WgXcQ', 'Judul Film AI', 'Genre: Sci-fi AI | Durasi: 1 jam | Tools: Sora + GPT-4o')">
      <img src="https://i.imgur.com/ZyU4TJo.jpeg" alt="Film 1">
    </div>
    <!-- Tambah film lain di sini -->
  </div>  <div class="player" id="player">
    <iframe id="video" src="" allowfullscreen></iframe>
  </div>  <div class="description" id="desc">
    <h2 id="judul">Pilih Film untuk Ditonton</h2>
    <p id="info">Deskripsi film akan muncul di sini.</p>
  </div>  <div class="donasi">
    <p>Dukung kami:</p>
    <!-- Ganti dengan QR donasi Dana/OVO/GoPay -->
    <img src="https://i.imgur.com/YourQRCode.png" alt="Donasi QR">
  </div>  <script>
    function tonton(link, judul, info) {
      document.getElementById('video').src = link;
      document.getElementById('judul').textContent = judul;
      document.getElementById('info').textContent = info;
    }
  </script></body>
</html>
