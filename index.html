<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vynix - Streaming</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Vynix</h1>
    </header>

    <section id="movies">
        <h2>Pilih Film</h2>
        <div class="movie-grid">
            <!-- Ganti poster dan video dengan filemu -->
            <div class="movie-card" onclick="playVideo('https://www.w3schools.com/html/mov_bbb.mp4', 'Big Buck Bunny')">
                <img src="https://via.placeholder.com/200x300?text=Poster+1" alt="Movie 1">
                <h3>Big Buck Bunny</h3>
            </div>
            <div class="movie-card" onclick="playVideo('https://www.w3schools.com/html/movie.mp4', 'Sample Movie')">
                <img src="https://via.placeholder.com/200x300?text=Poster+2" alt="Movie 2">
                <h3>Sample Movie</h3>
            </div>
            <!-- Tambah film di sini -->
        </div>
    </section>

    <section id="player" class="hidden">
        <h2 id="video-title">Judul Film</h2>
        <!-- Iklan di atas video -->
        <div class="ad-container">
            <div class="ad-placeholder">Iklan: [Tempat untuk Google AdSense atau iklan lain]</div>
        </div>
        <video id="video-player" controls>
            <source src="" type="video/mp4">
            Browser kamu tidak mendukung video.
        </video>
        <button onclick="closePlayer()">Tutup</button>
    </section>

    <!-- Iklan sidebar atau footer -->
    <aside class="ad-container">
        <div class="ad-placeholder">Iklan Sidebar: [Tempat untuk Google AdSense atau iklan lain]</div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
